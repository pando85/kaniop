name: Finish person credential PR v2

on:
  push:
    branches:
      - fix/person-credential-bootstrap-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/person-credential-bootstrap-state

      - name: Apply final changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reconcile_path = Path("libs/person/src/reconcile.rs")
          reconcile = reconcile_path.read_text()

          if "use kanidm_proto::attribute::Attribute;" not in reconcile:
              reconcile = reconcile.replace(
                  "use kanidm_client::KanidmClient;\n",
                  "use kanidm_client::KanidmClient;\nuse kanidm_proto::attribute::Attribute;\n",
                  1,
              )
          if "use kanidm_proto::scim_v1::ScimEntryGetQuery;" not in reconcile:
              reconcile = reconcile.replace(
                  "use kanidm_proto::v1::Entry;\n",
                  "use kanidm_proto::scim_v1::ScimEntryGetQuery;\nuse kanidm_proto::v1::Entry;\n",
                  1,
              )

          if "async fn credential_attributes_searchable" not in reconcile:
              marker = "fn bootstrap_token_expired(status: &CredentialBootstrapStatus) -> bool {"
              assert marker in reconcile
              helper = r'''fn scim_search_allows_all_credential_attributes(search: &serde_json::Value) -> bool {
              match search {
                  serde_json::Value::String(access) => access == "Grant",
                  serde_json::Value::Object(access) => access
                      .get("Allow")
                      .and_then(serde_json::Value::as_array)
                      .is_some_and(|allowed| {
                          [
                              ATTR_PRIMARY_CREDENTIAL,
                              ATTR_PASSKEYS,
                              ATTR_ATTESTED_PASSKEYS,
                          ]
                          .into_iter()
                          .all(|required| {
                              allowed
                                  .iter()
                                  .any(|attribute| attribute.as_str() == Some(required))
                          })
                      }),
                  _ => false,
              }
          }

          async fn credential_attributes_searchable(
              kanidm_client: &KanidmClient,
              name: &str,
          ) -> std::result::Result<bool, kanidm_client::ClientError> {
              let query = ScimEntryGetQuery {
                  attributes: Some(vec![
                      Attribute::PrimaryCredential,
                      Attribute::PassKeys,
                      Attribute::AttestedPasskeys,
                  ]),
                  ext_access_check: true,
                  ..Default::default()
              };
              let path = format!("/scim/v1/Person/{name}");
              let entry: serde_json::Value = kanidm_client
                  .perform_get_request_query(&path, Some(query))
                  .await?;

              Ok(entry
                  .get("extAccessCheck")
                  .and_then(|access| access.get("search"))
                  .is_some_and(scim_search_allows_all_credential_attributes))
          }

          '''
              reconcile = reconcile.replace(marker, helper + marker, 1)

          if "credential attributes are not searchable; leaving state unknown" not in reconcile:
              search_from = reconcile.index("        let credential_state = if current_person.is_some() {")
              start = reconcile.index("            match probe {", search_from)
              end = reconcile.index(
                  "        } else {\n            CredentialState::Unknown",
                  start,
              )
              replacement = r'''            match probe {
                  Ok((primary, passkeys, attested_passkeys)) => {
                      let observed_state = credential_state_from_attributes(
                          &primary,
                          &passkeys,
                          &attested_passkeys,
                      );
                      let state = if observed_state == CredentialState::Present {
                          CredentialState::Present
                      } else {
                          match credential_attributes_searchable(&kanidm_client, &name).await {
                              Ok(true) => CredentialState::Absent,
                              Ok(false) => {
                                  warn!(
                                      "credential attributes are not searchable; leaving state unknown"
                                  );
                                  CredentialState::Unknown
                              }
                              Err(e) => {
                                  warn!(
                                      error = ?e,
                                      "credential effective-access probe failed; leaving state unknown"
                                  );
                                  CredentialState::Unknown
                              }
                          }
                      };
                      trace!(
                          credential_state = ?state,
                          primary_present = primary.as_ref().is_some_and(|v| v.is_empty().not()),
                          passkeys_count = passkeys.as_ref().map_or(0, Vec::len),
                          attested_passkeys_count = attested_passkeys.as_ref().map_or(0, Vec::len),
                          "read-only credential status"
                      );
                      metrics.record_kanidm_sdk_outcome(
                          KANIDM_RESOURCE_PERSON,
                          KANIDM_OP_GET_CREDENTIAL_STATUS,
                          if state == CredentialState::Unknown {
                              KANIDM_OUTCOME_ERROR
                          } else {
                              KANIDM_OUTCOME_UNCHANGED
                          },
                          cred_start.elapsed(),
                      );
                      state
                  }
                  Err(e) => {
                      warn!(
                          error = ?e,
                          "read-only credential status probe failed; leaving state unknown"
                      );
                      metrics.record_kanidm_sdk_outcome(
                          KANIDM_RESOURCE_PERSON,
                          KANIDM_OP_GET_CREDENTIAL_STATUS,
                          KANIDM_OUTCOME_ERROR,
                          cred_start.elapsed(),
                      );
                      CredentialState::Unknown
                  }
              }
          '''
              reconcile = reconcile[:start] + replacement + reconcile[end:]

          if "fn scim_allow_requires_all_credential_attributes" not in reconcile:
              marker = "    #[test]\n    fn unknown_credential_state_never_creates_reset_token() {"
              assert marker in reconcile
              tests = r'''    #[test]
              fn scim_grant_allows_all_credential_attributes() {
                  assert!(scim_search_allows_all_credential_attributes(
                      &serde_json::json!("Grant")
                  ));
              }

              #[test]
              fn scim_allow_requires_all_credential_attributes() {
                  assert!(scim_search_allows_all_credential_attributes(
                      &serde_json::json!({
                          "Allow": [
                              ATTR_PRIMARY_CREDENTIAL,
                              ATTR_PASSKEYS,
                              ATTR_ATTESTED_PASSKEYS
                          ]
                      })
                  ));
                  assert!(!scim_search_allows_all_credential_attributes(
                      &serde_json::json!({
                          "Allow": [ATTR_PRIMARY_CREDENTIAL, ATTR_PASSKEYS]
                      })
                  ));
              }

              #[test]
              fn scim_deny_or_malformed_access_is_not_searchable() {
                  assert!(!scim_search_allows_all_credential_attributes(
                      &serde_json::json!("Deny")
                  ));
                  assert!(!scim_search_allows_all_credential_attributes(
                      &serde_json::json!({})
                  ));
              }

          '''
              reconcile = reconcile.replace(marker, tests + marker, 1)

          reconcile_path.write_text(reconcile)

          e2e_path = Path("tests/e2e/test/person_credentials.rs")
          e2e = e2e_path.read_text()

          if "async fn create_person_cr_for_kanidm" not in e2e:
              start = e2e.index("async fn create_person_cr(")
              end = e2e.index("async fn create_existing_person", start)
              helper = r'''async fn create_person_cr_for_kanidm(
              api: &Api<KanidmPersonAccount>,
              name: &str,
              displayname: &str,
              kanidm_name: &str,
          ) -> String {
              let person_spec = json!({
                  "kanidmRef": {"name": kanidm_name},
                  "personAttributes": {"displayname": displayname},
              });
              let person = KanidmPersonAccount::new(name, serde_json::from_value(person_spec).unwrap());
              api.create(&PostParams::default(), &person)
                  .await
                  .unwrap()
                  .uid()
                  .unwrap()
          }

          async fn create_person_cr(
              api: &Api<KanidmPersonAccount>,
              name: &str,
              displayname: &str,
          ) -> String {
              create_person_cr_for_kanidm(api, name, displayname, KANIDM_NAME).await
          }

          '''
              e2e = e2e[:start] + helper + e2e[end:]

          if "person_unreadable_credential_attributes_are_unknown_without_token" not in e2e:
              e2e += r'''

          e2e_test!(person_unreadable_credential_attributes_are_unknown_without_token, {
              const RESTRICTED_KANIDM_NAME: &str = "test-person-credential-unknown";
              let name = "test-cred-unreadable";
              let s = setup_kanidm_connection(RESTRICTED_KANIDM_NAME).await;
              create_existing_person(&s.kanidm_client, name, "Unreadable Credentials").await;

              s.kanidm_client
                  .idm_group_add_members("idm_people_pii_read", &["idm_admins"])
                  .await
                  .unwrap();
              s.kanidm_client
                  .idm_group_remove_members("idm_people_admins", &["idm_admins"])
                  .await
                  .unwrap();

              // Re-authenticate the operator after changing effective permissions.
              restart_operator(s.client.clone()).await;

              let person_api = Api::<KanidmPersonAccount>::namespaced(s.client.clone(), "default");
              let uid = create_person_cr_for_kanidm(
                  &person_api,
                  name,
                  "Unreadable Credentials",
                  RESTRICTED_KANIDM_NAME,
              )
              .await;

              wait_for(
                  person_api.clone(),
                  name,
                  has_credential_state(CredentialState::Unknown),
              )
              .await;
              wait_for(
                  person_api.clone(),
                  name,
                  has_bootstrap_state(CredentialBootstrapState::Pending),
              )
              .await;
              tokio::time::sleep(stabilization_delay()).await;

              let status = person_api.get(name).await.unwrap().status.unwrap();
              let credential_condition = status
                  .conditions
                  .as_ref()
                  .unwrap()
                  .iter()
                  .find(|condition| condition.type_ == "Credential")
                  .unwrap();
              assert_eq!(credential_condition.status, "Unknown");
              assert_eq!(token_event_count(s.client.clone(), "default", &uid).await, 0);

              // Restore built-in ACL topology and make the account credentialed before cleanup.
              s.kanidm_client
                  .idm_group_add_members("idm_people_admins", &["idm_admins"])
                  .await
                  .unwrap();
              s.kanidm_client
                  .idm_group_remove_members("idm_people_pii_read", &["idm_admins"])
                  .await
                  .unwrap();
              s.kanidm_client
                  .idm_person_account_primary_credential_set_password(
                      name,
                      "e2e-unknown-cleanup-password-123",
                  )
                  .await
                  .unwrap();
              restart_operator(s.client.clone()).await;
              wait_for(
                  person_api.clone(),
                  name,
                  has_credential_state(CredentialState::Present),
              )
              .await;

              delete_person_cr(&person_api, name).await;
          });
          '''

          e2e_path.write_text(e2e)
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/person/src/reconcile.rs tests/e2e/test/person_credentials.rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(person): verify credential attribute visibility"
            git push origin HEAD:fix/person-credential-bootstrap-state
          fi
