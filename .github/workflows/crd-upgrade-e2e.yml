name: CRD Upgrade E2E

# Tests that upgrading from the previous published release applies the current CRDs through
# the chart's crdApply hook, with `helm upgrade` and with an Argo CD sync.
"on":
  push:
    branches: [master]
    paths: &crd_upgrade_paths
      # Files defining the CRD types generated by cmd/crdgen and applied by the crdApply hook
      # (cmd/crd-migrator). The generated charts/kaniop/crds/crds.yaml is not committed, and the
      # schemas embed types from dependencies (k8s-openapi, gateway-api, kube, schemars), so
      # dependency manifests are included too. A narrower filter let #1112 break the upgrade
      # path unnoticed.
      - 'libs/**/crd.rs'
      - 'libs/operator/src/kanidm/restore/legacy.rs'
      - 'cmd/crdgen/**'
      - 'cmd/crd-migrator/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/*/Cargo.toml'
      - 'charts/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'tests/e2e/scripts/crd-upgrade-*.sh'
      - '.github/workflows/crd-upgrade-e2e.yml'
  pull_request:
    branches: [master]
    paths: *crd_upgrade_paths
  workflow_dispatch:
    inputs:
      previous_chart_version:
        description: 'Chart version to upgrade from (default: latest published release)'
        required: false
        default: ''
        type: string
      run_argocd:
        description: 'Run the Argo CD upgrade test'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-images:
    name: Build operator images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      CARGO_TARGET: x86_64-unknown-linux-gnu
      CARGO_RELEASE_PROFILE: release-e2e
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - run: rustup override set ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          workspaces: ". -> target-x86_64-unknown-linux-gnu"

      - name: Record image version
        id: meta
        run: echo "version=g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: VERSION="${{ steps.meta.outputs.version }}" make images

      - name: Generate CRDs
        run: make crdgen

      - name: Export images
        run: TMP_DIR="$RUNNER_TEMP" VERSION="${{ steps.meta.outputs.version }}" make save-images

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: kaniop-images
          path: ${{ runner.temp }}/kaniop-images-*.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload CRDs artifact
        uses: actions/upload-artifact@v7
        with:
          name: kaniop-crds
          path: charts/kaniop/crds/crds.yaml
          retention-days: 1
          if-no-files-found: error

  helm-upgrade:
    name: Helm CRD Upgrade E2E
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KANIOP_IMAGE_VERSION: ${{ needs.build-images.outputs.version }}
      PREVIOUS_CHART_VERSION: ${{ github.event.inputs.previous_chart_version }}
      SKIP_IMAGE_BUILD: "true"
      SKIP_CRDGEN: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kind and kubectl
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION: v0.33.0
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: v1.37.2
        run: |
          set -euo pipefail
          # Both release hosts hand out binaries from the same GitHub CDN, so a CDN outage fails
          # every URL at once: one run got HTTP 504 from all of them and died installing kind.
          # The runner image already ships kind and kubectl, so use those when they match the
          # pinned version, retry each host with backoff when they do not, and keep the runner
          # version as a last resort instead of failing on infrastructure outages. `kind` prints
          # its version without the v prefix, `kubectl --version` is not a flag, and only the
          # kubectl client version line counts as a match, so compare the unprefixed version at
          # digit boundaries to keep a prefix like 1.37.2 from matching 1.37.20.
          tool_output() {
            case "$1" in
              kubectl) kubectl version --client | grep -iE 'client.?version' ;;
              *) "$1" --version ;;
            esac 2>/dev/null || true
          }
          has_version() {
            local name="$1" want="${2#v}" out
            command -v "$name" >/dev/null 2>&1 || return 1
            out="$(tool_output "$name")"
            printf '%s\n' "$out" | grep -qE "(^|[^0-9])${want//./\\.}"'([^0-9]|$)'
          }
          install_tool() {
            local name="$1" want="$2" url attempt
            shift 2
            if has_version "$name" "$want"; then
              echo "Reusing the runner provided $(tool_output "$name" | head -n 1)"
              return 0
            fi
            for url in "$@"; do
              for attempt in 1 2 3; do
                [ "$attempt" -eq 1 ] || sleep $((attempt * 20))
                echo "Attempt ${attempt} to install ${name} from ${url}"
                if curl -fsSL --connect-timeout 10 --max-time 600 \
                  --retry 3 --retry-delay 10 --retry-all-errors --retry-max-time 90 \
                  -o "/tmp/${name}" "${url}" &&
                  chmod +x "/tmp/${name}" && sudo mv "/tmp/${name}" "/usr/local/bin/${name}"; then
                  echo "${name} ${want} installed"
                  return 0
                fi
              done
            done
            if command -v "$name" >/dev/null 2>&1; then
              echo "::warning::All ${name} downloads failed, using the runner provided $(tool_output "$name" | head -n 1) instead of ${want}"
              return 0
            fi
            echo "Failed to install ${name} after all attempts: no runner provided binary either" >&2
            return 1
          }
          install_tool kind "$KIND_VERSION" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          install_tool kubectl "$KUBECTL_VERSION" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

      - name: Install helm
        env:
          # renovate: datasource=github-releases depName=helm/helm
          HELM_VERSION: v4.3.1
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            [ "$attempt" -eq 1 ] || sleep $((attempt * 20))
            echo "Attempt ${attempt} to install helm..."
            if curl -fsSL --connect-timeout 10 --max-time 600 \
              --retry 3 --retry-delay 10 --retry-all-errors --retry-max-time 90 \
              -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" &&
              rm -rf linux-amd64 && tar xzf /tmp/helm.tar.gz &&
              sudo mv linux-amd64/helm /usr/local/bin/helm; then
              echo "helm installed successfully"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install helm after all attempts" >&2
              exit 1
            fi
          done

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-images
          path: ${{ runner.temp }}/kaniop-artifacts

      - name: Load pre-built images
        run: |
          gzip -dc "${RUNNER_TEMP}"/kaniop-artifacts/kaniop-images-*.tar.gz | docker load
          docker image ls

      - name: Download CRDs artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-crds
          path: charts/kaniop/crds

      - name: Run Helm CRD upgrade e2e test
        env:
          E2E_LOGGING_LEVEL: "info,kaniop=debug,kaniop_webhook=debug"
          CLEANUP_ON_EXIT: "false"
        run: tests/e2e/scripts/crd-upgrade-helm.sh

  argocd-upgrade:
    name: Argo CD CRD Upgrade E2E
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_argocd == 'true'
    env:
      KANIOP_IMAGE_VERSION: ${{ needs.build-images.outputs.version }}
      PREVIOUS_CHART_VERSION: ${{ github.event.inputs.previous_chart_version }}
      SKIP_IMAGE_BUILD: "true"
      SKIP_CRDGEN: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kind and kubectl
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION: v0.33.0
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: v1.37.2
