          set -euo pipefail
          # Both release hosts hand out binaries from the same GitHub CDN, so a CDN outage fails
          # every URL at once: one run got HTTP 504 from all of them and died installing kind.
          # The runner image already ships kind and kubectl, so use those when they match the
          # pinned version, retry each host with backoff when they do not, and keep the runner
          # version as a last resort instead of failing on infrastructure outages. `kind` prints
          # its version without the v prefix, `kubectl --version` is not a flag, and only the
          # kubectl client version line counts as a match, so compare the unprefixed version at
          # digit boundaries to keep a prefix like 1.37.2 from matching 1.37.20.
          tool_output() {
            case "$1" in
              kubectl) kubectl version --client | grep -iE 'client.?version' ;;
              *) "$1" --version ;;
            esac 2>/dev/null || true
          }
          has_version() {
            local name="$1" want="${2#v}" out
            command -v "$name" >/dev/null 2>&1 || return 1
            out="$(tool_output "$name")"
            printf '%s\n' "$out" | grep -qE "(^|[^0-9])${want//./\\.}"'([^0-9]|$)'
          }
          install_tool() {
            local name="$1" want="$2" url attempt
            shift 2
            if has_version "$name" "$want"; then
              echo "Reusing the runner provided $(tool_output "$name" | head -n 1)"
              return 0
            fi
            for url in "$@"; do
