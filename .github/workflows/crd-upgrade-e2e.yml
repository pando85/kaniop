name: CRD Upgrade E2E

# Tests that upgrading from the previous published release applies the current CRDs through
# the chart's crdApply hook, with `helm upgrade` and with an Argo CD sync.
"on":
  push:
    branches: [master]
    paths: &crd_upgrade_paths
      # Files defining the CRD types generated by cmd/crdgen and applied by the crdApply hook
      # (cmd/crd-migrator). The generated charts/kaniop/crds/crds.yaml is not committed, and the
      # schemas embed types from dependencies (k8s-openapi, gateway-api, kube, schemars), so
      # dependency manifests are included too. A narrower filter let #1112 break the upgrade
      # path unnoticed.
      - 'libs/**/crd.rs'
      - 'libs/operator/src/kanidm/restore/legacy.rs'
      - 'cmd/crdgen/**'
      - 'cmd/crd-migrator/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/*/Cargo.toml'
      - 'charts/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'tests/e2e/scripts/crd-upgrade-*.sh'
      - '.github/workflows/crd-upgrade-e2e.yml'
  pull_request:
    branches: [master]
    paths: *crd_upgrade_paths
  workflow_dispatch:
    inputs:
      previous_chart_version:
        description: 'Chart version to upgrade from (default: latest published release)'
        required: false
        default: ''
        type: string
      run_argocd:
        description: 'Run the Argo CD upgrade test'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-images:
    name: Build operator images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      CARGO_TARGET: x86_64-unknown-linux-gnu
      CARGO_RELEASE_PROFILE: release-e2e
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - run: rustup override set ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
          workspaces: ". -> target-x86_64-unknown-linux-gnu"

      - name: Record image version
        id: meta
        run: echo "version=g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: VERSION="${{ steps.meta.outputs.version }}" make images

      - name: Generate CRDs
        run: make crdgen

      - name: Export images
        run: TMP_DIR="$RUNNER_TEMP" VERSION="${{ steps.meta.outputs.version }}" make save-images

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: kaniop-images
          path: ${{ runner.temp }}/kaniop-images-*.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload CRDs artifact
        uses: actions/upload-artifact@v7
        with:
          name: kaniop-crds
          path: charts/kaniop/crds/crds.yaml
          retention-days: 1
          if-no-files-found: error

  helm-upgrade:
    name: Helm CRD Upgrade E2E
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KANIOP_IMAGE_VERSION: ${{ needs.build-images.outputs.version }}
      PREVIOUS_CHART_VERSION: ${{ github.event.inputs.previous_chart_version }}
      SKIP_IMAGE_BUILD: "true"
      SKIP_CRDGEN: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kind and kubectl
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION: v0.33.0
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: v1.37.2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep $((attempt * 30))
            echo "Attempt ${attempt} to install kind..."
            if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" && \
               chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind; then
              echo "kind installed successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "GitHub releases failed, trying kind.sigs.k8s.io fallback..."
              if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" && \
                 chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind; then
                echo "kind installed successfully from kind.sigs.k8s.io"
                break
              fi
              echo "Failed to install kind after all attempts"
              exit 1
            fi
          done
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep $((attempt * 30))
            echo "Attempt ${attempt} to install kubectl..."
            if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && \
               chmod +x /tmp/kubectl && sudo mv /tmp/kubectl /usr/local/bin/kubectl; then
              echo "kubectl installed successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "Failed to install kubectl after 3 attempts"
              exit 1
            fi
          done

      - name: Install helm
        env:
          # renovate: datasource=github-releases depName=helm/helm
          HELM_VERSION: v4.3.1
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-images
          path: ${{ runner.temp }}/kaniop-artifacts

      - name: Load pre-built images
        run: |
          gzip -dc "${RUNNER_TEMP}"/kaniop-artifacts/kaniop-images-*.tar.gz | docker load
          docker image ls

      - name: Download CRDs artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-crds
          path: charts/kaniop/crds

      - name: Run Helm CRD upgrade e2e test
        env:
          E2E_LOGGING_LEVEL: "info,kaniop=debug,kaniop_webhook=debug"
          CLEANUP_ON_EXIT: "false"
        run: tests/e2e/scripts/crd-upgrade-helm.sh

  argocd-upgrade:
    name: Argo CD CRD Upgrade E2E
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_argocd == 'true'
    env:
      KANIOP_IMAGE_VERSION: ${{ needs.build-images.outputs.version }}
      PREVIOUS_CHART_VERSION: ${{ github.event.inputs.previous_chart_version }}
      SKIP_IMAGE_BUILD: "true"
      SKIP_CRDGEN: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /opt/google \
            /opt/azure \
            /usr/local/share/vcpkg \
            /usr/local/share/man \
            /usr/local/share/doc \
            /usr/share/swift \
            /usr/local/julia*
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          mkdir -p /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install kind and kubectl
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION: v0.33.0
          # renovate: datasource=github-releases depName=kubernetes/kubernetes
          KUBECTL_VERSION: v1.37.2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep $((attempt * 30))
            echo "Attempt ${attempt} to install kind..."
            if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" && \
               chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind; then
              echo "kind installed successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "GitHub releases failed, trying kind.sigs.k8s.io fallback..."
              if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" && \
                 chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind; then
                echo "kind installed successfully from kind.sigs.k8s.io"
                break
              fi
              echo "Failed to install kind after all attempts"
              exit 1
            fi
          done
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep $((attempt * 30))
            echo "Attempt ${attempt} to install kubectl..."
            if curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && \
               chmod +x /tmp/kubectl && sudo mv /tmp/kubectl /usr/local/bin/kubectl; then
              echo "kubectl installed successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "Failed to install kubectl after 3 attempts"
              exit 1
            fi
          done

      - name: Install helm
        env:
          # renovate: datasource=github-releases depName=helm/helm
          HELM_VERSION: v4.3.1
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-images
          path: ${{ runner.temp }}/kaniop-artifacts

      - name: Load pre-built images
        run: |
          gzip -dc "${RUNNER_TEMP}"/kaniop-artifacts/kaniop-images-*.tar.gz | docker load
          docker image ls

      - name: Download CRDs artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-crds
          path: charts/kaniop/crds

      - name: Run Argo CD CRD upgrade e2e test
        env:
          E2E_LOGGING_LEVEL: "info,kaniop=debug,kaniop_webhook=debug"
          CLEANUP_ON_EXIT: "false"
        run: tests/e2e/scripts/crd-upgrade-argocd.sh
