name: Apply backup DR beta implementation

"on":
  push:
    branches:
      - feat/backup-dr-beta

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/backup-dr-beta
          fetch-depth: 0

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - run: rustup override set ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@v2

      - name: Harden one-shot patch scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_backup_dr_beta.py')
          lines = path.read_text().splitlines(keepends=True)

          for i, line in enumerate(lines):
              if 'printcolumn = r#' in line and 'kanidmRef.name' in line:
                  lines[i] = "text = read(path)\nold = '.spec.kanidmRef.name'\nidx = text.rfind(old)\nif idx < 0:\n    raise RuntimeError('KanidmBackup printcolumn not found')\nwrite(path, text[:idx] + '.spec.source.kanidmName' + text[idx + len(old):])\n"
                  if i + 1 < len(lines) and 'spec.source.kanidmName' in lines[i + 1]:
                      lines[i + 1] = ''
                  break
          else:
              raise SystemExit('KanidmBackup printcolumn assertion not found')

          start = None
          for i, line in enumerate(lines):
              if line.strip() == 'replace(path,' and any(
                  'let manifest_key = backup_manifest_key' in candidate
                  for candidate in lines[i:i + 20]
              ):
                  start = i
                  break
          if start is None:
              raise SystemExit('validation manifest-key patch block not found')
          end = start
          while end < len(lines) and "''', 1)" not in lines[end]:
              end += 1
          if end >= len(lines):
              raise SystemExit('validation manifest-key patch block end not found')
          lines[start:end + 1] = [
              "regex(path,\n",
              "      r'''(pub fn build_validation_job\\(.*?let ca_bundle_path = spec\\.s3\\.ca_bundle_ref\\.as_ref\\(\\)\\.map\\(\\|_\\| ca_bundle_path\\(\\)\\);\\n)''',\n",
              "      r'''\\1    let manifest_key = backup_manifest_key(backup, repository)?;\\n''', count=1)\n",
          ]

          comment = next(
              (i for i, line in enumerate(lines) if '# Legacy field names in test literals.' in line),
              None,
          )
          if comment is None:
              raise SystemExit('legacy field cleanup comment not found')
          for i in range(comment + 1, min(comment + 8, len(lines))):
              if 're.sub' in lines[i] and 'manifest_key' in lines[i]:
                  lines[i] = "    text = re.sub(r'(KanidmBackupSpec\\s*\\{(?:(?!\\n\\s*\\}).)*?)\\n\\s*manifest_key:\\s*[^,\\n]+,', r'\\1', text, flags=re.DOTALL)\n"
                  break
          else:
              raise SystemExit('broad manifest_key constructor cleanup not found')

          path.write_text(''.join(lines))
          PY

      - name: Apply approved API and implementation
        run: python3 .github/scripts/apply_backup_dr_beta.py

      - name: Complete result provenance constructors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('libs/backup-core/src/result.rs')
          text = path.read_text()
          pattern = r'(pub fn failure\(.*?image_digest: None,\n)(\s*error: Some\(ResultError \{)'
          replacement = (
              r'\1'
              '            source_namespace: None,\n'
              '            source_kanidm_name: None,\n'
              '            source_kanidm_uid: None,\n'
              r'\2'
          )
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'failure constructor provenance patch count: {count}')
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check compilation early
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Regenerate CRDs
        run: make crdgen

      - name: Regenerate examples
        run: make examples

      - name: Format generated Rust consumers
        run: cargo fmt --all

      - name: Run repository lint gate
        run: make lint

      - name: Run repository test gate
        run: make test

      - name: Remove one-shot implementation machinery
        run: |
          rm -f .github/scripts/apply_backup_dr_beta.py
          rm -f .github/workflows/apply-backup-dr-beta.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(backup): support cross-cluster disaster recovery"
          git push origin HEAD:feat/backup-dr-beta
