name: Apply backup DR beta implementation

"on":
  push:
    branches:
      - feat/backup-dr-beta

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/backup-dr-beta
          fetch-depth: 0

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - run: rustup override set ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@v2

      - name: Harden one-shot patch scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_backup_dr_beta.py')
          lines = path.read_text().splitlines(keepends=True)

          # Schedule and KanidmBackup share the same print-column text in alpha.
          # Change only the KanidmBackup occurrence (the last one in crd.rs).
          for i, line in enumerate(lines):
              if 'printcolumn = r#' in line and 'kanidmRef.name' in line:
                  lines[i] = (
                      "text = read(path)\n"
                      "old = '.spec.kanidmRef.name'\n"
                      "idx = text.rfind(old)\n"
                      "if idx < 0:\n"
                      "    raise RuntimeError('KanidmBackup printcolumn not found')\n"
                      "write(path, text[:idx] + '.spec.source.kanidmName' + text[idx + len(old):])\n"
                  )
                  if i + 1 < len(lines) and 'spec.source.kanidmName' in lines[i + 1]:
                      lines[i + 1] = ''
                  break
          else:
              raise SystemExit('KanidmBackup printcolumn assertion not found')

          # The CA-bundle prelude exists in validation and deletion builders. Replace
          # only the explicit validation injection block, leaving the signature
          # migration to Result<Job> intact.
          start = None
          for i, line in enumerate(lines):
              if (
                  line.strip() == 'replace(path,'
                  and i + 1 < len(lines)
                  and "'''    let ca_bundle_path = spec.s3.ca_bundle_ref" in lines[i + 1]
              ):
                  start = i
                  break
          if start is None:
              raise SystemExit('validation manifest-key injection block not found')
          end = start
          while end < len(lines) and "''', 1)" not in lines[end]:
              end += 1
          if end >= len(lines):
              raise SystemExit('validation manifest-key injection block end not found')
          lines[start:end + 1] = [
              "regex(path,\n",
              "      r'''(pub fn build_validation_job\\(.*?let ca_bundle_path = spec\\.s3\\.ca_bundle_ref\\.as_ref\\(\\)\\.map\\(\\|_\\| ca_bundle_path\\(\\)\\);\\n)''',\n",
              "      r'''\\1    let manifest_key = backup_manifest_key(backup, repository)?;\\n''', count=1)\n",
          ]

          # The final tree-wide compatibility pass was too broad: kanidm_ref is also
          # used by Schedule, OAuth2, Group, Person, etc. Keep the type migration,
          # but never rewrite arbitrary .spec.kanidm_ref accesses.
          for i, line in enumerate(lines):
              if "text = text.replace('.spec.kanidm_ref.uid'" in line:
                  lines[i] = ''
              if "text = text.replace('.spec.kanidm_ref.name'" in line:
                  lines[i] = ''

          # Likewise, namespace_uid -> namespace is a wire-protocol change, not a
          # global Rust identifier rewrite. Protocol-bearing files were already
          # migrated explicitly above.
          for i, line in enumerate(lines):
              if "text = path_obj.read_text().replace('namespace_uid:', 'namespace:')" in line:
                  lines[i] = "    text = path_obj.read_text()\n"

          # Only KanidmBackupSpec loses manifest_key. Do not remove manifest keys
          # from ResultDocument, OperationDocument, or internal helper structs.
          comment = next(
              (i for i, line in enumerate(lines) if '# Legacy field names in test literals.' in line),
              None,
          )
          if comment is None:
              raise SystemExit('legacy field cleanup comment not found')
          for i in range(comment + 1, min(comment + 8, len(lines))):
              if 're.sub' in lines[i] and 'manifest_key' in lines[i]:
                  lines[i] = (
                      "    text = re.sub(r'(KanidmBackupSpec\\s*\\{(?:(?!\\n\\s*\\}).)*?)"
                      "\\n\\s*manifest_key:\\s*[^,\\n]+,', r'\\1', text, flags=re.DOTALL)\n"
                  )
                  break
          else:
              raise SystemExit('broad manifest_key constructor cleanup not found')

          path.write_text(''.join(lines))
          PY

      - name: Apply approved API and implementation
        run: python3 .github/scripts/apply_backup_dr_beta.py

      - name: Complete scoped beta migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new, expected))

          # ResultDocument::failure needs the same optional provenance fields as success.
          path = Path('libs/backup-core/src/result.rs')
          text = path.read_text()
          pattern = r'(pub fn failure\(.*?image_digest: None,\n)(\s*error: Some\(ResultError \{)'
          replacement = (
              r'\1'
              '            source_namespace: None,\n'
              '            source_kanidm_name: None,\n'
              '            source_kanidm_uid: None,\n'
              r'\2'
          )
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'failure constructor provenance patch count: {count}')
          path.write_text(text)

          # Remove the final alpha-only public manifest key in backup-core tests.
          replace_exact(
              Path('libs/backup-core/src/crd.rs'),
              '            manifest_key: "v1/tenants/ns/clusters/k/backups/b/manifest.json".to_string(),\n',
              '',
          )

          # Backup controller: the catalog now owns historical source identity and
          # storage keys are derived from it. There is no arbitrary manifest key to
          # validate during deletion.
          path = Path('libs/backup/src/controller/backup.rs')
          text = path.read_text()
          text = text.replace(
              'let kanidm_name = &backup.spec.kanidm_ref.name;',
              'let kanidm_name = &backup.spec.source.kanidm_name;',
          )
          deletion_pattern = re.compile(
              r'    let manifest_key = &obj\.spec\.manifest_key;\n'
              r'.*?'
              r'    if !repo_path\.contains_prefix\(&backup_prefix\) \{\n'
              r'.*?'
              r'    \}\n\n',
              flags=re.DOTALL,
          )
          deletion_replacement = '''    let backup_prefix = repo_path
              .backup_path(
                  &obj.spec.source.namespace,
                  &obj.spec.source.kanidm_uid,
                  &obj.spec.backup_id,
              )
              .map_err(|e| Error::MissingData(format!("invalid backup path: {e}")))?;

'''
          text, count = deletion_pattern.subn(deletion_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'backup deletion path migration count: {count}')
          path.write_text(text)

          # Discovery carries namespace NAME as historical source provenance. Remove
          # the obsolete manifest-key argument from CR construction and compare the
          # discovered backup ID against existing catalog IDs.
          path = Path('libs/backup/src/controller/discovery.rs')
          text = path.read_text()
          old_param = '    namespace_uid: &str,\n    kanidm_uid: &str,\n) -> Job {'
          if text.count(old_param) != 1:
              raise SystemExit(f'discover job source namespace parameter count: {text.count(old_param)}')
          text = text.replace(
              old_param,
              '    source_namespace: &str,\n    kanidm_uid: &str,\n) -> Job {',
              1,
          )
          text = text.replace(
              'if existing_manifest_keys.contains(manifest_key) {',
              'if existing_manifest_keys.contains(&backup_id) {',
          )
          old_call = '''        let backup_cr = build_backup_cr(
            manifest_key,
            &backup_id,
            &repo_name,
            kanidm_name,
            kanidm_uid,
        );'''
          new_call = '''        let backup_cr = build_backup_cr(
            &backup_id,
            &repo_name,
            namespace,
            kanidm_name,
            kanidm_uid,
        );'''
          if text.count(old_call) != 1:
              raise SystemExit(f'build_backup_cr call migration count: {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          old_sig = '''fn build_backup_cr(
    manifest_key: &str,
    backup_id: &str,
    repository_name: &str,
    kanidm_name: &str,
    kanidm_uid: &str,
) -> KanidmBackup {'''
          new_sig = '''fn build_backup_cr(
    backup_id: &str,
    repository_name: &str,
    source_namespace: &str,
    kanidm_name: &str,
    kanidm_uid: &str,
) -> KanidmBackup {'''
          if text.count(old_sig) != 1:
              raise SystemExit(f'build_backup_cr signature migration count: {text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)
          # Scope namespace replacement to build_backup_cr only.
          fn_start = text.index('fn build_backup_cr(')
          fn_end = text.index('\n}\n\nfn merge_conditions', fn_start)
          block = text[fn_start:fn_end]
          if 'namespace: namespace.to_string(),' not in block:
              raise SystemExit('build_backup_cr source namespace assignment not found')
          block = block.replace(
              'namespace: namespace.to_string(),',
              'namespace: source_namespace.to_string(),',
              1,
          )
          text = text[:fn_start] + block + text[fn_end:]
          path.write_text(text)

          # Restore helper now receives the verified historical UID explicitly.
          path = Path('libs/operator/src/kanidm/restore/legacy.rs')
          text = path.read_text()
          old = 'fn build_download_operation_doc(\n    restore: &KanidmRestore,'
          if text.count(old) == 1:
              text = text.replace(old, 'fn build_download_operation_doc(\n    _restore: &KanidmRestore,', 1)

          # Migrate stale KanidmBackupSpec test literals in restore tests.
          backup_source_pattern = re.compile(
              r'(?P<indent>[ \t]*)(?:kanidm_ref|source): '
              r'kaniop_backup_core::crd::(?:BackupKanidmRef|BackupSource) \{\n'
              r'(?P<inner>[ \t]*)name: (?P<name>[^,\n]+),\n'
              r'(?P=inner)uid: (?P<uid>[^,\n]+),\n'
              r'(?P=indent)\},'
          )

          def replace_backup_source(match: re.Match[str]) -> str:
              indent = match.group('indent')
              inner = match.group('inner')
              return (
                  f'{indent}source: kaniop_backup_core::crd::BackupSource {{\n'
                  f'{inner}namespace: "default".to_string(),\n'
                  f'{inner}kanidm_name: {match.group("name")},\n'
                  f'{inner}kanidm_uid: {match.group("uid")},\n'
                  f'{indent}}},'
              )

          text, migrated_sources = backup_source_pattern.subn(replace_backup_source, text)

          # Public manifest_key was removed from KanidmBackupSpec. Restrict deletion
          # to those initializer blocks only.
          lines = text.splitlines(keepends=True)
          i = 0
          removed_manifest_keys = 0
          while i < len(lines):
              if 'KanidmBackupSpec {' not in lines[i]:
                  i += 1
                  continue
              depth = 0
              j = i
              while j < len(lines):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if j > i and depth == 0:
                      break
                  j += 1
              if j >= len(lines):
                  raise SystemExit('unterminated KanidmBackupSpec initializer')
              k = i + 1
              while k < j:
                  if lines[k].lstrip().startswith('manifest_key:'):
                      del lines[k]
                      j -= 1
                      removed_manifest_keys += 1
                      continue
                  k += 1
              i = j + 1
          text = ''.join(lines)

          # Every KanidmRestoreSource initializer must state the third union arm.
          lines = text.splitlines(keepends=True)
          i = 0
          added_external_none = 0
          while i < len(lines):
              line = lines[i]
              if 'KanidmRestoreSource {' not in line or line.lstrip().startswith('pub struct KanidmRestoreSource'):
                  i += 1
                  continue
              depth = 0
              j = i
              while j < len(lines):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if j > i and depth == 0:
                      break
                  j += 1
              if j >= len(lines):
                  raise SystemExit('unterminated KanidmRestoreSource initializer')
              block = ''.join(lines[i:j + 1])
              if 'external_backup:' not in block:
                  opening_indent = re.match(r'[ \t]*', line).group(0)
                  lines.insert(j, f'{opening_indent}    external_backup: None,\n')
                  added_external_none += 1
                  j += 1
              i = j + 1
          text = ''.join(lines)

          # Existing unit tests use the old 12-argument download-builder shape.
          download_call_pattern = re.compile(
              r'(build_download_operation_doc\((?:(?!\n[ \t]*\);).)*?\n'
              r'(?P<indent>[ \t]*)"[A-Za-z0-9-]+",\n)'
              r'(?P=indent)(?P<boolean>true|false),',
              flags=re.DOTALL,
          )

          def add_expected_uid(match: re.Match[str]) -> str:
              return (
                  match.group(1)
                  + match.group('indent') + '"uid",\n'
                  + match.group('indent') + match.group('boolean') + ','
              )

          text, migrated_calls = download_call_pattern.subn(add_expected_uid, text)
          path.write_text(text)

          # Only backup-specific E2E code moves from kanidmRef to historical source.
          # Leave the shared KanidmRef tests and other CRDs untouched.
          e2e_replacements = {
              'tests/e2e/test/kanidm/backup_transport.rs': [
                  ('backup.spec.kanidm_ref.name', 'backup.spec.source.kanidm_name'),
              ],
              'tests/e2e/test/kanidm/mod.rs': [
                  ('backup.spec.kanidm_ref.name', 'backup.spec.source.kanidm_name'),
              ],
              'tests/e2e/test/kanidm/backup.rs': [
                  ('b.spec.kanidm_ref.name', 'b.spec.source.kanidm_name'),
                  ('backup.spec.kanidm_ref.name', 'backup.spec.source.kanidm_name'),
              ],
              'tests/e2e/test/kanidm/restore.rs': [
                  ('backup.spec.kanidm_ref.name', 'backup.spec.source.kanidm_name'),
              ],
          }
          for file_name, replacements in e2e_replacements.items():
              file_path = Path(file_name)
              current = file_path.read_text()
              for old, new in replacements:
                  current = current.replace(old, new)
              file_path.write_text(current)

          print(
              'post-migration fixes:',
              f'restore_backup_sources={migrated_sources}',
              f'restore_manifest_keys={removed_manifest_keys}',
              f'external_none={added_external_none}',
              f'download_calls={migrated_calls}',
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check compilation early
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Regenerate CRDs
        run: make crdgen

      - name: Regenerate examples
        run: make examples

      - name: Format generated Rust consumers
        run: cargo fmt --all

      - name: Run repository lint gate
        run: make lint

      - name: Run repository test gate
        run: make test

      - name: Remove one-shot implementation machinery
        run: |
          rm -f .github/scripts/apply_backup_dr_beta.py
          rm -f .github/workflows/apply-backup-dr-beta.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(backup): support cross-cluster disaster recovery"
          git push origin HEAD:feat/backup-dr-beta
