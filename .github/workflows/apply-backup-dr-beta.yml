name: Apply backup DR beta implementation

"on":
  push:
    branches:
      - feat/backup-dr-beta

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/backup-dr-beta
          fetch-depth: 0

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - run: rustup override set ${{ steps.toolchain.outputs.name }}
      - uses: Swatinem/rust-cache@v2

      - name: Harden one-shot patch scoping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_backup_dr_beta.py')
          lines = path.read_text().splitlines(keepends=True)

          for i, line in enumerate(lines):
              if 'printcolumn = r#' in line and 'kanidmRef.name' in line:
                  lines[i] = "text = read(path)\nold = '.spec.kanidmRef.name'\nidx = text.rfind(old)\nif idx < 0:\n    raise RuntimeError('KanidmBackup printcolumn not found')\nwrite(path, text[:idx] + '.spec.source.kanidmName' + text[idx + len(old):])\n"
                  if i + 1 < len(lines) and 'spec.source.kanidmName' in lines[i + 1]:
                      lines[i + 1] = ''
                  break
          else:
              raise SystemExit('KanidmBackup printcolumn assertion not found')

          start = None
          for i, line in enumerate(lines):
              if line.strip() == 'replace(path,' and any(
                  'let manifest_key = backup_manifest_key' in candidate
                  for candidate in lines[i:i + 20]
              ):
                  start = i
                  break
          if start is None:
              raise SystemExit('validation manifest-key patch block not found')
          end = start
          while end < len(lines) and "''', 1)" not in lines[end]:
              end += 1
          if end >= len(lines):
              raise SystemExit('validation manifest-key patch block end not found')
          lines[start:end + 1] = [
              "regex(path,\n",
              "      r'''(pub fn build_validation_job\\(.*?let ca_bundle_path = spec\\.s3\\.ca_bundle_ref\\.as_ref\\(\\)\\.map\\(\\|_\\| ca_bundle_path\\(\\)\\);\\n)''',\n",
              "      r'''\\1    let manifest_key = backup_manifest_key(backup, repository)?;\\n''', count=1)\n",
          ]

          comment = next(
              (i for i, line in enumerate(lines) if '# Legacy field names in test literals.' in line),
              None,
          )
          if comment is None:
              raise SystemExit('legacy field cleanup comment not found')
          for i in range(comment + 1, min(comment + 8, len(lines))):
              if 're.sub' in lines[i] and 'manifest_key' in lines[i]:
                  lines[i] = "    text = re.sub(r'(KanidmBackupSpec\\s*\\{(?:(?!\\n\\s*\\}).)*?)\\n\\s*manifest_key:\\s*[^,\\n]+,', r'\\1', text, flags=re.DOTALL)\n"
                  break
          else:
              raise SystemExit('broad manifest_key constructor cleanup not found')

          path.write_text(''.join(lines))
          PY

      - name: Apply approved API and implementation
        run: python3 .github/scripts/apply_backup_dr_beta.py

      - name: Complete scoped beta migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ResultDocument::failure needs the same optional provenance fields as success.
          path = Path('libs/backup-core/src/result.rs')
          text = path.read_text()
          pattern = r'(pub fn failure\(.*?image_digest: None,\n)(\s*error: Some\(ResultError \{)'
          replacement = (
              r'\1'
              '            source_namespace: None,\n'
              '            source_kanidm_name: None,\n'
              '            source_kanidm_uid: None,\n'
              r'\2'
          )
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'failure constructor provenance patch count: {count}')
          path.write_text(text)

          # Remove the last stale alpha-only public manifest key from backup-core tests.
          path = Path('libs/backup-core/src/crd.rs')
          text = path.read_text()
          old = '            manifest_key: "v1/tenants/ns/clusters/k/backups/b/manifest.json".to_string(),\n'
          if text.count(old) != 1:
              raise SystemExit(f'stale KanidmBackupSpec manifest_key count: {text.count(old)}')
          path.write_text(text.replace(old, '', 1))

          # Schedule is intentionally not part of the beta catalog cut. Restore two
          # operator call sites that the broad catalog rename accidentally touched.
          schedule_fixes = [
              (
                  Path('libs/operator/src/kanidm/controller/mod.rs'),
                  'let kanidm_name = &schedule.spec.source.kanidm_name;',
                  'let kanidm_name = &schedule.spec.kanidm_ref.name;',
              ),
              (
                  Path('libs/operator/src/kanidm/reconcile/transport.rs'),
                  '.filter(|schedule| schedule.spec.source.kanidm_name == kanidm_name)',
                  '.filter(|schedule| schedule.spec.kanidm_ref.name == kanidm_name)',
              ),
          ]
          for file_path, old, new in schedule_fixes:
              current = file_path.read_text()
              if current.count(old) != 1:
                  raise SystemExit(f'{file_path}: schedule fix count for {old!r}: {current.count(old)}')
              file_path.write_text(current.replace(old, new, 1))

          path = Path('libs/operator/src/kanidm/restore/legacy.rs')
          text = path.read_text()

          # The helper now receives the verified historical UID explicitly, so the
          # restore object is intentionally unused by the pure document builder.
          old = 'fn build_download_operation_doc(\n    restore: &KanidmRestore,'
          if text.count(old) == 1:
              text = text.replace(old, 'fn build_download_operation_doc(\n    _restore: &KanidmRestore,', 1)

          # Migrate stale KanidmBackupSpec test literals. All remaining old literals
          # are test-only after the main implementation transform.
          backup_source_pattern = re.compile(
              r'(?P<indent>[ \t]*)(?:kanidm_ref|source): '
              r'kaniop_backup_core::crd::(?:BackupKanidmRef|BackupSource) \{\n'
              r'(?P<inner>[ \t]*)name: (?P<name>[^,\n]+),\n'
              r'(?P=inner)uid: (?P<uid>[^,\n]+),\n'
              r'(?P=indent)\},'
          )

          def replace_backup_source(match: re.Match[str]) -> str:
              indent = match.group('indent')
              inner = match.group('inner')
              return (
                  f'{indent}source: kaniop_backup_core::crd::BackupSource {{\n'
                  f'{inner}namespace: "default".to_string(),\n'
                  f'{inner}kanidm_name: {match.group("name")},\n'
                  f'{inner}kanidm_uid: {match.group("uid")},\n'
                  f'{indent}}},'
              )

          text, migrated_sources = backup_source_pattern.subn(replace_backup_source, text)
          if migrated_sources == 0:
              raise SystemExit('no stale KanidmBackupSpec source literals were migrated')

          # Public manifest_key was removed from KanidmBackupSpec. Restrict deletion
          # to KanidmBackupSpec initializer blocks so result/operation manifest keys stay intact.
          lines = text.splitlines(keepends=True)
          i = 0
          removed_manifest_keys = 0
          while i < len(lines):
              if 'KanidmBackupSpec {' not in lines[i]:
                  i += 1
                  continue
              depth = 0
              j = i
              while j < len(lines):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if j > i and depth == 0:
                      break
                  j += 1
              if j >= len(lines):
                  raise SystemExit('unterminated KanidmBackupSpec initializer')
              k = i + 1
              while k < j:
                  if lines[k].lstrip().startswith('manifest_key:'):
                      del lines[k]
                      j -= 1
                      removed_manifest_keys += 1
                      continue
                  k += 1
              i = j + 1
          text = ''.join(lines)

          # Every KanidmRestoreSource initializer must state the third union arm.
          # Insert None into legacy literals while preserving explicit externalBackup cases.
          lines = text.splitlines(keepends=True)
          i = 0
          added_external_none = 0
          while i < len(lines):
              line = lines[i]
              if 'KanidmRestoreSource {' not in line or line.lstrip().startswith('pub struct KanidmRestoreSource'):
                  i += 1
                  continue
              depth = 0
              j = i
              while j < len(lines):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if j > i and depth == 0:
                      break
                  j += 1
              if j >= len(lines):
                  raise SystemExit('unterminated KanidmRestoreSource initializer')
              block = ''.join(lines[i:j + 1])
              if 'external_backup:' not in block:
                  opening_indent = re.match(r'[ \t]*', line).group(0)
                  lines.insert(j, f'{opening_indent}    external_backup: None,\n')
                  added_external_none += 1
                  j += 1
              i = j + 1
          text = ''.join(lines)
          if added_external_none == 0:
              raise SystemExit('no legacy KanidmRestoreSource literals needed migration')

          # Existing tests call the download builder with the old 12-argument shape.
          # Insert the historical source UID between region and forcePathStyle only
          # when a literal region is followed directly by a boolean (already-migrated
          # calls have the UID there and do not match).
          download_call_pattern = re.compile(
              r'(build_download_operation_doc\((?:(?!\n[ \t]*\);).)*?\n'
              r'(?P<indent>[ \t]*)"[A-Za-z0-9-]+",\n)'
              r'(?P=indent)(?P<boolean>true|false),',
              flags=re.DOTALL,
          )

          def add_expected_uid(match: re.Match[str]) -> str:
              return (
                  match.group(1)
                  + match.group('indent') + '"uid",\n'
                  + match.group('indent') + match.group('boolean') + ','
              )

          text, migrated_calls = download_call_pattern.subn(add_expected_uid, text)
          if migrated_calls == 0:
              raise SystemExit('no legacy build_download_operation_doc calls were migrated')

          path.write_text(text)
          print(
              'post-migration fixes:',
              f'backup_sources={migrated_sources}',
              f'manifest_keys={removed_manifest_keys}',
              f'external_none={added_external_none}',
              f'download_calls={migrated_calls}',
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Check compilation early
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Regenerate CRDs
        run: make crdgen

      - name: Regenerate examples
        run: make examples

      - name: Format generated Rust consumers
        run: cargo fmt --all

      - name: Run repository lint gate
        run: make lint

      - name: Run repository test gate
        run: make test

      - name: Remove one-shot implementation machinery
        run: |
          rm -f .github/scripts/apply_backup_dr_beta.py
          rm -f .github/workflows/apply-backup-dr-beta.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(backup): support cross-cluster disaster recovery"
          git push origin HEAD:feat/backup-dr-beta
