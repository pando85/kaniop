name: PR 929 restore immutable recovery

"on":
  push:
    branches: [agent/statefulset-apply-strategy]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/statefulset-apply-strategy
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply immutable recovery split
        shell: python
        run: |
          from pathlib import Path

          context_path = Path("libs/operator/src/controller/context.rs")
          context = context_path.read_text()
          context = context.replace(
              "use tracing::{debug, error, trace};",
              "use tracing::{debug, error, info, trace};",
          )

          marker = "#[allow(async_fn_in_trait)]\npub trait KubeOperations<T, K>"
          start = context.index(marker)
          replacement = r'''fn is_immutable_update_message(message: &str) -> bool {
              let message = message.to_ascii_lowercase();

              message.contains("field is immutable")
                  || message.contains("may not change once set")
                  || message.contains("may not be changed once set")
                  || (message.contains("updates to statefulset spec for fields other than")
                      && message.contains("are forbidden"))
          }

          #[allow(async_fn_in_trait)]
          pub trait KubeOperations<T, K>
          where
              T: Resource + ResourceExt + Lookup + Clone + 'static,
              <T as Lookup>::DynamicType: Eq + std::hash::Hash + Clone,
              K: Resource<Scope = NamespaceResourceScope>
                  + Serialize
                  + Clone
                  + std::fmt::Debug
                  + for<'de> Deserialize<'de>,
              <K as kube::Resource>::DynamicType: Default,
              <K as Resource>::Scope: std::marker::Sized,
          {
              async fn kube_delete(
                  &self,
                  client: Client,
                  metrics: &ControllerMetrics,
                  obj: &K,
              ) -> Result<()>;
              async fn kube_apply(&self, client: Client, obj: K, operator_name: &str) -> Result<K>;
              async fn kube_patch(
                  &self,
                  client: Client,
                  metrics: &ControllerMetrics,
                  obj: K,
                  operator_name: &str,
              ) -> Result<K>;
          }

          impl<T, K> KubeOperations<T, K> for T
          where
              T: Resource + ResourceExt + Lookup + Clone + 'static,
              <T as Lookup>::DynamicType: Eq + std::hash::Hash + Clone,
              K: Resource<Scope = NamespaceResourceScope>
                  + Serialize
                  + Clone
                  + std::fmt::Debug
                  + for<'de> Deserialize<'de>,
              <K as kube::Resource>::DynamicType: Default,
              <K as Resource>::Scope: std::marker::Sized,
          {
              async fn kube_delete(
                  &self,
                  client: Client,
                  _metrics: &ControllerMetrics,
                  obj: &K,
              ) -> Result<()> {
                  let name = obj.name_any();
                  // safe unwrap: self is namespaced scoped
                  let namespace = kube::ResourceExt::namespace(self).unwrap();
                  trace!(
                      msg = format!("deleting {}", short_type_name::<K>().unwrap_or("Unknown")),
                      resource.name = &name,
                      resource.namespace = &namespace
                  );
                  let api = Api::<K>::namespaced(client, &namespace);
                  match api.delete(&name, &Default::default()).await {
                      Ok(_) => Ok(()),
                      Err(kube::Error::Api(ae)) if ae.code == 404 => {
                          trace!(
                              msg = format!(
                                  "{} not found, treating delete as successful",
                                  short_type_name::<K>().unwrap_or("Unknown")
                              ),
                              resource.name = &name,
                              resource.namespace = &namespace
                          );
                          Ok(())
                      }
                      Err(e) => Err(Error::KubeError(
                          format!(
                              "failed to delete {} {namespace}/{name}",
                              short_type_name::<K>().unwrap_or("Unknown")
                          ),
                          Box::new(e),
                      )),
                  }
              }

              async fn kube_apply(&self, client: Client, obj: K, operator_name: &str) -> Result<K> {
                  let name = obj.name_any();
                  // safe unwrap: self is namespaced scoped
                  let namespace = kube::ResourceExt::namespace(self).unwrap();
                  trace!(
                      msg = format!("applying {}", short_type_name::<K>().unwrap_or("Unknown")),
                      resource.name = &name,
                      resource.namespace = &namespace
                  );
                  let resource_api = Api::<K>::namespaced(client, &namespace);

                  resource_api
                      .patch(
                          &name,
                          &PatchParams::apply(operator_name).force(),
                          &Patch::Apply(&obj),
                      )
                      .await
                      .map_err(|e| {
                          Error::KubeError(
                              format!(
                                  "failed to patch {} {namespace}/{name}",
                                  short_type_name::<K>().unwrap_or("Unknown")
                              ),
                              Box::new(e),
                          )
                      })
              }

              async fn kube_patch(
                  &self,
                  client: Client,
                  metrics: &ControllerMetrics,
                  obj: K,
                  operator_name: &str,
              ) -> Result<K> {
                  let name = obj.name_any();
                  // safe unwrap: self is namespaced scoped
                  let namespace = kube::ResourceExt::namespace(self).unwrap();
                  let result = self
                      .kube_apply(client.clone(), obj.clone(), operator_name)
                      .await;

                  if let Err(Error::KubeError(_, cause)) = &result
                      && let kube::Error::Api(ae) = cause.as_ref()
                      && ae.code == 422
                      && is_immutable_update_message(&ae.message)
                  {
                      info!(
                          msg = format!(
                              "recreating {} because an immutable field changed",
                              short_type_name::<K>().unwrap_or("Unknown")
                          ),
                          resource.name = &name,
                          resource.namespace = &namespace,
                          reason = %ae.reason,
                          message = %ae.message,
                      );
                      self.kube_delete(client.clone(), metrics, &obj).await?;
                      metrics.reconcile_deploy_delete_create_inc(
                          short_type_name::<K>().unwrap_or("Unknown"),
                          "immutable_api_error",
                      );
                      return self.kube_apply(client, obj, operator_name).await;
                  }

                  if let Err(Error::KubeError(_, cause)) = &result
                      && let kube::Error::Api(ae) = cause.as_ref()
                      && ae.code == 422
                  {
                      debug!(
                          msg = "server-side apply rejected resource with a non-immutable 422; preserving the existing resource",
                          resource.kind = short_type_name::<K>().unwrap_or("Unknown"),
                          resource.name = &name,
                          resource.namespace = &namespace,
                          reason = %ae.reason,
                          message = %ae.message,
                      );
                  }

                  result
              }
          }

          #[cfg(test)]
          mod test {
              use super::is_immutable_update_message;

              #[test]
              fn immutable_update_messages_are_classified() {
                  assert!(is_immutable_update_message(
                      "Deployment.apps \"example\" is invalid: spec.selector: Invalid value: v1.LabelSelector{}: field is immutable"
                  ));
                  assert!(is_immutable_update_message(
                      "Service \"example\" is invalid: spec.clusterIPs[0]: Invalid value: \"10.0.0.1\": may not change once set"
                  ));
                  assert!(is_immutable_update_message(
                      "StatefulSet.apps \"example\" is invalid: spec: Forbidden: updates to statefulset spec for fields other than 'replicas', 'ordinals', 'template', 'updateStrategy', 'revisionHistoryLimit', 'persistentVolumeClaimRetentionPolicy' and 'minReadySeconds' are forbidden"
                  ));
              }

              #[test]
              fn ordinary_validation_messages_are_not_classified_as_immutable() {
                  assert!(!is_immutable_update_message(
                      "StatefulSet.apps \"example\" is invalid: spec.minReadySeconds: Invalid value: -1: must be greater than or equal to 0"
                  ));
                  assert!(!is_immutable_update_message(
                      "StatefulSet.apps \"example\" is invalid: spec.template.spec.containers[0].image: Required value"
                  ));
              }
          }
          '''
          context = context[:start] + replacement
          context_path.write_text(context)

          reconcile_path = Path("libs/operator/src/kanidm/reconcile/mod.rs")
          reconcile = reconcile_path.read_text()
          fn_start = reconcile.index("async fn reconcile_statefulset(")
          fn_end = reconcile.index("\n/// Return true only when the error structurally wraps", fn_start)
          block = reconcile[fn_start:fn_end]
          patch_count = block.count("kanidm.patch(&ctx,")
          if patch_count != 7:
              raise SystemExit(f"expected 7 StatefulSet patch calls, found {patch_count}")
          block = block.replace("kanidm.patch(&ctx,", "kanidm.apply(&ctx,")
          reconcile = reconcile[:fn_start] + block + reconcile[fn_end:]

          patch_marker = "    pub async fn patch<K>(&self, ctx: &Context, resource: K) -> Result<K>\n"
          patch_pos = reconcile.index(patch_marker)
          apply_method = r'''    /// Server-side apply without any generic delete/recreate fallback.
              /// Resource-specific reconcilers use this when they own lifecycle decisions.
              pub async fn apply<K>(&self, ctx: &Context, resource: K) -> Result<K>
              where
                  K: Resource<Scope = NamespaceResourceScope>
                      + Serialize
                      + Clone
                      + std::fmt::Debug
                      + for<'de> Deserialize<'de>,
                  <K as kube::Resource>::DynamicType: Default,
                  <K as Resource>::Scope: std::marker::Sized,
              {
                  self.kube_apply(
                      ctx.kaniop_ctx.client.clone(),
                      resource,
                      KANIDM_OPERATOR_NAME,
                  )
                  .await
              }

          '''
          reconcile = reconcile[:patch_pos] + apply_method + reconcile[patch_pos:]
          reconcile_path.write_text(reconcile)

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          cargo test --locked -p kaniop-operator --lib

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/operator/src/controller/context.rs libs/operator/src/kanidm/reconcile/mod.rs
          git commit -m "fix(operator): preserve generic immutable recovery"
          git push origin HEAD:agent/statefulset-apply-strategy
