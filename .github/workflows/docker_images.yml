name: Release images

"on":
  push:
    branches:
      - master

    tags:
      - v*

jobs:
  push:
    # Pinned: ubuntu-latest moved to ubuntu-26.04, whose GCC defaults to
    # -march=x86-64-v3 and shipped AVX2 C code (SIGILL on CPUs without AVX).
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      # C dependencies (aws-lc-sys, openssl-src) use the compiler default -march;
      # force the baseline so release binaries run on every x86-64 CPU. Assembly
      # fast paths are still selected at runtime from CPUID.
      CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx for multiarch images
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            target-x86_64-unknown-linux-gnu
            target-aarch64-unknown-linux-gnu

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: rustup override set ${{steps.toolchain.outputs.name}}

      - name: Build x86_64 release binaries
        run: make release

      - name: Check x86_64 binaries run on a baseline CPU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          .ci/check-x86-64-baseline.sh target-x86_64-unknown-linux-gnu/x86_64-unknown-linux-gnu/release

      - name: Push image
        env:
          TMP_DIR: ${{ runner.temp }}
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest

          VERSION=$VERSION make push-images
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get Changelog Entry
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: v${{ env.VERSION }}
          path: ./CHANGELOG.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
