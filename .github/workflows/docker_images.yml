name: Release images

"on":
  push:
    branches:
      - master

    tags:
      - v*

jobs:
  push:
    # The host can use amd64v3; x86 release binaries are built and tested in
    # the separate baseline-compatible Debian userspace.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      # Keep this set for any native C builds on the host as well.
      CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx for multiarch images
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-baseline-container-v1
          cache-directories: |
            target-x86_64-unknown-linux-gnu
            target-aarch64-unknown-linux-gnu

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: rustup override set ${{steps.toolchain.outputs.name}}

      - name: Build and check x86_64 release binaries
        run: .ci/build-x86-release.sh

      - name: Push image
        env:
          TMP_DIR: ${{ runner.temp }}
          # Publish the exact x86 binaries tested above; never rebuild on the host.
          PREBUILT_X86_RELEASE: "1"
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest

          VERSION=$VERSION make push-images
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get Changelog Entry
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: v${{ env.VERSION }}
          path: ./CHANGELOG.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
