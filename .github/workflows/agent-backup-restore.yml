# Temporary remote workspace for PR #943; removed before final review.
name: Agent backup restore implementation

on:
  push:
    branches:
      - agent/backup-restore
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/backup-restore')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply implementation
        run: python3 .github/agent-backup-restore.py

      - name: Fix implementation against current APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'libs/person/src/reconcile.rs',
              'libs/group/src/reconcile.rs',
              'libs/oauth2/src/reconcile/mod.rs',
              'libs/service-account/src/reconcile/mod.rs',
          ]:
              p = Path(name)
              text = p.read_text()
              text = text.replace('ctx.kaniop_ctx.kanidm_write_allowed', 'ctx.kanidm_write_allowed')
              p.write_text(text)

          p = Path('libs/operator/src/kanidm/restore.rs')
          text = p.read_text().replace(
              'use kube::runtime::finalizer::{Error as FinalizerError, Event as Finalizer, finalizer};',
              'use kube::runtime::finalizer::{Event as Finalizer, finalizer};',
          )
          p.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Regenerate CRDs
        run: make crdgen

      - name: Regenerate examples
        run: make examples

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat(kanidm): implement backup and restore orchestration"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
