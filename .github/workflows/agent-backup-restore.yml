# Temporary remote workspace for PR #943; removed before final review.
name: Agent backup restore validation

on:
  push:
    branches:
      - agent/backup-restore-validation

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/backup-restore-validation
          fetch-depth: 0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backup-restore-validation

      - name: Apply implementation
        run: python3 .github/agent-backup-restore.py

      - name: Fix implementation against current APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('libs/operator/src/kanidm/restore.rs')
          if p.exists():
              text = p.read_text().replace(
                  'use kube::runtime::finalizer::{Error as FinalizerError, Event as Finalizer, finalizer};',
                  'use kube::runtime::finalizer::{Event as Finalizer, finalizer};',
              )
              p.write_text(text)

          p = Path('libs/group/src/reconcile.rs')
          text = p.read_text().replace(
              'ctx.kaniop_ctx.kanidm_write_allowed(',
              'ctx.kanidm_write_allowed(',
          )
          p.write_text(text)

          p = Path('cmd/operator/src/main.rs')
          text = p.read_text().replace(
              ')\n        .5?;',
              ')\n        .6?;',
              1,
          )
          p.write_text(text)

          p = Path('libs/operator/src/kanidm/reconcile/statefulset.rs')
          text = p.read_text().replace(
              '    fn create_kanidm_with_replica_group() -> (Kanidm, ReplicaGroup) {',
              '    pub(super) fn create_kanidm_with_replica_group() -> (Kanidm, ReplicaGroup) {',
              1,
          )
          text = text.replace(
              '        let (mut kanidm, mut replica_group) = create_kanidm_with_replica_group();',
              '        let (mut kanidm, mut replica_group) = tests::create_kanidm_with_replica_group();',
              1,
          )
          p.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      # Catch source/test errors before paying for the release CRD build.
      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Regenerate CRDs
        run: make crdgen

      - name: Regenerate examples
        run: make examples

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Verify generated tree
        run: |
          make lint
          make test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "feat(kanidm): implement backup and restore orchestration"
          git push origin HEAD:agent/backup-restore-validation
