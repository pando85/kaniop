name: Auto tag

"on":
  workflow_run:
    workflows: [Rust]
    branches: [master]
    types: [completed]

jobs:
  tag:
    # Never create a release tag before the exact master commit passes CI.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
        uses: actions/checkout@v7

      - name: Verify release artifact exists
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"kaniop-x86-release-$HEAD_SHA\" and .expired == false) | .id")
          if [[ -z "$artifact_id" ]]; then
            echo "::error::Verified x86 release artifact is missing; refusing to tag"
            exit 1
          fi

      - name: Get last changelog version
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          path: ./CHANGELOG.md

      - name: Check if tag exists
        run: |
          tag=${{ steps.changelog_reader.outputs.version }}
          if git ls-remote --tags origin | grep -q "refs/tags/$tag"; then
            echo "Tag already exists"
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag does not exist"
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Import GPG key
        if: env.TAG_EXISTS == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Create new tag
        if: env.TAG_EXISTS == 'false'
        run: |
          # Ignore a completed CI run if master has advanced in the meantime.
          if [[ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$(git rev-parse HEAD)" ]]; then
            echo "Master advanced; its own CI run will handle tagging."
            exit 0
          fi
          tag=${{ steps.changelog_reader.outputs.version }}
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git tag -s "$tag" -m "$tag" --local-user $(gpg --list-keys --with-colons | grep '^pub' | cut -d':' -f5)
          git push origin "$tag"
