name: Fix unknown credential ACL test

on:
  push:
    branches:
      - fix/person-credential-bootstrap-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/person-credential-bootstrap-state
      - name: Correct restricted read group
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/test/person_credentials.rs')
          s = p.read_text()
          needle = 'idm_people_pii_read'
          assert s.count(needle) == 2, s.count(needle)
          s = s.replace(needle, 'idm_account_mail_read')
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/test/person_credentials.rs
          git commit -m "test(e2e): restrict credential visibility without hiding person"
          git push origin HEAD:fix/person-credential-bootstrap-state
