name: Credential state implementation

on:
  push:
    branches: [fix/person-credential-state-e2e]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepatch CRD status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('libs/person/src/crd.rs')
          s = p.read_text()
          if 'pub enum CredentialState' not in s:
              marker = '/// Most recent observed status of the Kanidm Person Account. Read-only.\n'
              enum_def = '''/// Observed credential state for a Kanidm person account.
///
/// `Unknown` is deliberately distinct from `Absent`: failures while reading credential
/// attributes must never be interpreted as permission to issue a credential update token.
#[derive(Serialize, Deserialize, Clone, Copy, Debug, Default, PartialEq, Eq)]
#[cfg_attr(feature = "schemars", derive(JsonSchema))]
#[serde(rename_all = "camelCase")]
pub enum CredentialState {
    Present,
    Absent,
    #[default]
    Unknown,
}

'''
              s = s.replace(marker, enum_def + marker, 1)
          if 'pub credential_state: CredentialState' not in s:
              marker = '    pub conditions: Option<Vec<Condition>>,\n'
              fields = '''    pub conditions: Option<Vec<Condition>>,

    /// Last credential state observed through Kanidm's read-only person attributes.
    #[serde(default)]
    pub credential_state: CredentialState,

    /// Unix timestamp at which the currently issued bootstrap credential token expires.
    /// Persisting this in status prevents operator restarts from minting duplicate tokens.
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub credentials_token_expiry: Option<i64>,
'''
              s = s.replace(marker, fields, 1)
          p.write_text(s)
          PY
      - name: Apply implementation
        run: python .github/scripts/credential_state_impl.py
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check -p kaniop-person --all-features
          cargo check -p kaniop-e2e-tests --tests --features e2e-test
          make crdgen
      - name: Commit implementation if changed
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock libs/person/src/crd.rs libs/person/src/reconcile.rs tests/Cargo.toml tests/e2e/test/person.rs charts/kaniop/crds/crds.yaml; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "forkline-bot[bot]"
          git config user.email "bot-dev@forkline.dev"
          git add Cargo.toml Cargo.lock libs/person/src/crd.rs libs/person/src/reconcile.rs tests/Cargo.toml tests/e2e/test/person.rs charts/kaniop/crds/crds.yaml
          git commit -m "fix(person): make credential detection fail closed [impl-generated]"
          git push
