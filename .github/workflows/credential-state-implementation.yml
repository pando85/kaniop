name: Credential state implementation

on:
  push:
    branches: [fix/person-credential-state-e2e]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Align patch helper with current source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/credential_state_impl.py')
          s = p.read_text()
          s = s.replace(
              'marker = "/// The status object of `KanidmPersonAccount`\\n"',
              'marker = "/// Most recent observed status of the Kanidm Person Account. Read-only.\\n"',
          )
          s = s.replace(
              "    pub conditions: Option<Vec<Condition>>,\\n    pub ready: bool,\\n",
              "    pub conditions: Option<Vec<Condition>>,\\n\\n    pub ready: bool,\\n",
          )
          s = s.replace(
              "    pub conditions: Option<Vec<Condition>>,\\n    /// Last credential state observed",
              "    pub conditions: Option<Vec<Condition>>,\\n\\n    /// Last credential state observed",
          )
          p.write_text(s)
          PY
      - name: Apply implementation
        run: python .github/scripts/credential_state_impl.py
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check -p kaniop-person --all-features
          cargo check -p kaniop-e2e-tests --tests --features e2e-test
          make crdgen
      - name: Commit implementation if changed
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock libs/person/src/crd.rs libs/person/src/reconcile.rs tests/Cargo.toml tests/e2e/test/person.rs charts/kaniop/crds/crds.yaml; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git config user.name "forkline-bot[bot]"
          git config user.email "bot-dev@forkline.dev"
          git add Cargo.toml Cargo.lock libs/person/src/crd.rs libs/person/src/reconcile.rs tests/Cargo.toml tests/e2e/test/person.rs charts/kaniop/crds/crds.yaml
          git commit -m "fix(person): make credential detection fail closed [impl-generated]"
          git push
