name: Credential state implementation

on:
  push:
    branches: [fix/person-credential-state-e2e]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[impl-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement anchor: {label}")
              return text.replace(old, new, 1)

          # --- CRD: explicit credential observation state + persisted bootstrap expiry.
          p = Path("libs/person/src/crd.rs")
          s = p.read_text()
          marker = "/// The status object of `KanidmPersonAccount`\n"
          enum_def = '''/// Observed credential state for a Kanidm person account.\n///\n/// `Unknown` is deliberately distinct from `Absent`: failures while reading credential\n/// attributes must never be interpreted as permission to issue a credential update token.\n#[derive(Serialize, Deserialize, Clone, Copy, Debug, Default, PartialEq, Eq)]\n#[cfg_attr(feature = "schemars", derive(JsonSchema))]\n#[serde(rename_all = "camelCase")]\npub enum CredentialState {\n    Present,\n    Absent,\n    #[default]\n    Unknown,\n}\n\n'''
          s = replace_once(s, marker, enum_def + marker, "credential state enum")
          old = '''    pub conditions: Option<Vec<Condition>>,\n    pub ready: bool,\n'''
          new = '''    pub conditions: Option<Vec<Condition>>,\n    /// Last credential state observed through Kanidm's read-only person attributes.\n    #[serde(default)]\n    pub credential_state: CredentialState,\n    /// Unix timestamp at which the currently issued bootstrap credential token expires.\n    /// Persisting this in status prevents operator restarts from minting duplicate tokens.\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub credentials_token_expiry: Option<i64>,\n    pub ready: bool,\n'''
          s = replace_once(s, old, new, "status fields")
          p.write_text(s)

          # --- Reconciler.
          p = Path("libs/person/src/reconcile.rs")
          s = p.read_text()
          s = replace_once(
              s,
              'use crate::crd::{KanidmPersonAccount, KanidmPersonAccountStatus, KanidmPersonAttributes};',
              'use crate::crd::{CredentialState, KanidmPersonAccount, KanidmPersonAccountStatus, KanidmPersonAttributes};',
              "crd imports",
          )
          s = s.replace('use kanidm_client::{ClientError, KanidmClient};', 'use kanidm_client::KanidmClient;')
          s = s.replace(
              'use kanidm_proto::constants::{ATTR_ACCOUNT_EXPIRE, ATTR_ACCOUNT_VALID_FROM};\nuse kanidm_proto::internal::CUStatus;',
              'use kanidm_proto::constants::{\n    ATTR_ACCOUNT_EXPIRE, ATTR_ACCOUNT_VALID_FROM, ATTR_ATTESTED_PASSKEYS, ATTR_PASSKEYS,\n    ATTR_PRIMARY_CREDENTIAL,\n};',
          )
          s = s.replace('use kube::runtime::reflector::ObjectRef;\n', '')
          s = s.replace('use time::{OffsetDateTime, UtcOffset};', 'use time::{OffsetDateTime, UtcOffset};')
          s = replace_once(
              s,
              'const CONDITION_FALSE: &str = "False";\n\nfn credential_update_status_has_credentials(status: &CUStatus) -> bool {\n    status.primary.is_some()\n        || status.passkeys.is_empty().not()\n        || status.attested_passkeys.is_empty().not()\n}\n',
              '''const CONDITION_FALSE: &str = "False";\nconst CONDITION_UNKNOWN: &str = "Unknown";\n\nasync fn detect_credential_state(\n    kanidm_client: &KanidmClient,\n    name: &str,\n    metrics: &kaniop_operator::metrics::ControllerMetrics,\n) -> CredentialState {\n    let started = tokio::time::Instant::now();\n\n    // Kanidm's legacy credential-status endpoint only exposes the primary credential.\n    // Query the actual credential-bearing attributes directly instead. These are read-only\n    // requests, unlike credential_update_begin(), which creates a credential update session\n    // and can invalidate a user's in-progress session.\n    for attr in [\n        ATTR_PRIMARY_CREDENTIAL,\n        ATTR_PASSKEYS,\n        ATTR_ATTESTED_PASSKEYS,\n    ] {\n        match kanidm_client.idm_person_account_get_attr(name, attr).await {\n            Ok(Some(values)) if values.is_empty().not() => {\n                trace!(credential_attr = attr, values_count = values.len(), "credential attribute present");\n                metrics.record_kanidm_sdk_outcome(\n                    KANIDM_RESOURCE_PERSON,\n                    KANIDM_OP_GET_CREDENTIAL_STATUS,\n                    KANIDM_OUTCOME_UNCHANGED,\n                    started.elapsed(),\n                );\n                return CredentialState::Present;\n            }\n            Ok(_) => {}\n            Err(e) => {\n                warn!(credential_attr = attr, error = ?e, "credential attribute probe failed");\n                metrics.record_kanidm_sdk_outcome(\n                    KANIDM_RESOURCE_PERSON,\n                    KANIDM_OP_GET_CREDENTIAL_STATUS,\n                    KANIDM_OUTCOME_ERROR,\n                    started.elapsed(),\n                );\n                return CredentialState::Unknown;\n            }\n        }\n    }\n\n    metrics.record_kanidm_sdk_outcome(\n        KANIDM_RESOURCE_PERSON,\n        KANIDM_OP_GET_CREDENTIAL_STATUS,\n        KANIDM_OUTCOME_UNCHANGED,\n        started.elapsed(),\n    );\n    CredentialState::Absent\n}\n\nfn should_create_credentials_token(\n    credential_state: CredentialState,\n    credentials_token_expiry: Option<i64>,\n    now: i64,\n) -> bool {\n    credential_state == CredentialState::Absent\n        && credentials_token_expiry.map_or(true, |expiry| expiry <= now)\n}\n''',
              "credential detector",
          )

          old = '''        if is_person_false(TYPE_CREDENTIAL, status) {\n            let create_token = match ctx.internal_cache.read().await.get(&ObjectRef::from(self)) {\n                Some(expiry) if expiry > &OffsetDateTime::now_utc() => {\n                    trace!("token not expired, skipping creation");\n                    false\n                }\n                _ => true,\n            };\n            if create_token {\n                debug!(\n                    condition = TYPE_CREDENTIAL,\n                    status = CONDITION_FALSE,\n                    action = "create_reset_token",\n                    "condition triggered action"\n                );\n                record_kanidm_sdk_call(\n                    metrics,\n                    KANIDM_RESOURCE_PERSON,\n                    KANIDM_OP_CREDENTIAL_UPDATE_INTENT,\n                    KANIDM_OUTCOME_CHANGED,\n                    self.create_reset_token(&kanidm_client, name, ctx.clone()),\n                )\n                .await?;\n                changed = true;\n            };\n        };\n'''
          new = '''        if should_create_credentials_token(\n            status.credential_state,\n            status.credentials_token_expiry,\n            OffsetDateTime::now_utc().unix_timestamp(),\n        ) {\n            debug!(\n                credential_state = ?status.credential_state,\n                action = "create_reset_token",\n                "credential bootstrap required"\n            );\n            let expiry = record_kanidm_sdk_call(\n                metrics,\n                KANIDM_RESOURCE_PERSON,\n                KANIDM_OP_CREDENTIAL_UPDATE_INTENT,\n                KANIDM_OUTCOME_CHANGED,\n                self.create_reset_token(&kanidm_client, name, ctx.clone()),\n            )\n            .await?;\n            self.patch_credentials_token_expiry(ctx.clone(), status.clone(), expiry)\n                .await?;\n            changed = true;\n        }\n'''
          s = replace_once(s, old, new, "bootstrap action")

          s = replace_once(
              s,
              '    ) -> Result<()> {\n        debug!("create reset token");',
              '    ) -> Result<i64> {\n        debug!("create reset token");',
              "create token result",
          )
          old = '''        ctx.internal_cache\n            .write()\n            .await\n            .insert(ObjectRef::from(self), expiry_time);\n        Ok(())\n    }\n\n    async fn cleanup(\n'''
          new = '''        Ok(expiry_time.unix_timestamp())\n    }\n\n    async fn patch_credentials_token_expiry(\n        &self,\n        ctx: Arc<Context>,\n        mut status: KanidmPersonAccountStatus,\n        expiry: i64,\n    ) -> Result<()> {\n        status.credentials_token_expiry = Some(expiry);\n        let status_patch = Patch::Apply(KanidmPersonAccount {\n            status: Some(status),\n            ..KanidmPersonAccount::default()\n        });\n        let patch = PatchParams::apply(PERSON_OPERATOR_NAME).force();\n        let api = Api::<KanidmPersonAccount>::namespaced(\n            ctx.kaniop_ctx.client.clone(),\n            &self.get_namespace(),\n        );\n        api.patch_status(&self.name_any(), &patch, &status_patch)\n            .await\n            .map_err(|e| {\n                Error::kube_status_error(\n                    "KanidmPersonAccount",\n                    self.get_namespace(),\n                    self.name_any(),\n                    e,\n                )\n            })?;\n        Ok(())\n    }\n\n    async fn cleanup(\n'''
          s = replace_once(s, old, new, "persist token expiry")
          s = s.replace('''\n            ctx.internal_cache\n                .write()\n                .await\n                .remove(&ObjectRef::from(self));\n''', '\n')

          start = s.index('        let cred_start = tokio::time::Instant::now();')
          end_marker = '        let status = self.generate_status(current_person, credential_present)?;'
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''        let credential_state = if current_person.is_some() {\n            detect_credential_state(&kanidm_client, &name, metrics).await\n        } else {\n            CredentialState::Unknown\n        };\n\n        let status = self.generate_status(current_person, credential_state)?;'''
          s = s[:start] + replacement + s[end:]

          s = s.replace(
              '        credential_present: Option<bool>,\n',
              '        credential_state: CredentialState,\n',
              1,
          )
          old = '''                let credentials_condition = credential_present.map(|c| {\n                    if c {\n                        Condition {\n                            type_: TYPE_CREDENTIAL.to_string(),\n                            status: CONDITION_TRUE.to_string(),\n                            reason: "Present".to_string(),\n                            message: "Credentials are present.".to_string(),\n                            last_transition_time: last_transition_time(\n                                current_conditions,\n                                TYPE_CREDENTIAL,\n                                CONDITION_TRUE,\n                                "Present",\n                            ),\n                            observed_generation: self.metadata.generation,\n                        }\n                    } else {\n                        Condition {\n                            type_: TYPE_CREDENTIAL.to_string(),\n                            status: CONDITION_FALSE.to_string(),\n                            reason: "NotPresent".to_string(),\n                            message: "Credentials are not present.".to_string(),\n                            last_transition_time: last_transition_time(\n                                current_conditions,\n                                TYPE_CREDENTIAL,\n                                CONDITION_FALSE,\n                                "NotPresent",\n                            ),\n                            observed_generation: self.metadata.generation,\n                        }\n                    }\n                });\n'''
          new = '''                let credentials_condition = match credential_state {\n                    CredentialState::Present => Condition {\n                        type_: TYPE_CREDENTIAL.to_string(),\n                        status: CONDITION_TRUE.to_string(),\n                        reason: "Present".to_string(),\n                        message: "Credentials are present.".to_string(),\n                        last_transition_time: last_transition_time(\n                            current_conditions,\n                            TYPE_CREDENTIAL,\n                            CONDITION_TRUE,\n                            "Present",\n                        ),\n                        observed_generation: self.metadata.generation,\n                    },\n                    CredentialState::Absent => Condition {\n                        type_: TYPE_CREDENTIAL.to_string(),\n                        status: CONDITION_FALSE.to_string(),\n                        reason: "NotPresent".to_string(),\n                        message: "Credentials are not present.".to_string(),\n                        last_transition_time: last_transition_time(\n                            current_conditions,\n                            TYPE_CREDENTIAL,\n                            CONDITION_FALSE,\n                            "NotPresent",\n                        ),\n                        observed_generation: self.metadata.generation,\n                    },\n                    CredentialState::Unknown => Condition {\n                        type_: TYPE_CREDENTIAL.to_string(),\n                        status: CONDITION_UNKNOWN.to_string(),\n                        reason: "Unknown".to_string(),\n                        message: "Unable to determine credential state.".to_string(),\n                        last_transition_time: last_transition_time(\n                            current_conditions,\n                            TYPE_CREDENTIAL,\n                            CONDITION_UNKNOWN,\n                            "Unknown",\n                        ),\n                        observed_generation: self.metadata.generation,\n                    },\n                };\n'''
          s = replace_once(s, old, new, "credential condition")
          s = s.replace('.chain(credentials_condition)\n', '.chain([credentials_condition])\n', 1)

          old = '''                Ok(KanidmPersonAccountStatus {\n                    conditions: Some(conditions),\n                    ready: status,\n                    gid: current_person_posix.gidnumber,\n                    kanidm_ref: self.kanidm_ref(),\n                })\n'''
          new = '''                let credentials_token_expiry = match credential_state {\n                    CredentialState::Present => None,\n                    CredentialState::Absent | CredentialState::Unknown => self\n                        .status\n                        .as_ref()\n                        .and_then(|status| status.credentials_token_expiry),\n                };\n                Ok(KanidmPersonAccountStatus {\n                    conditions: Some(conditions),\n                    credential_state,\n                    credentials_token_expiry,\n                    ready: status,\n                    gid: current_person_posix.gidnumber,\n                    kanidm_ref: self.kanidm_ref(),\n                })\n'''
          s = replace_once(s, old, new, "existing status fields")
          old = '''                Ok(KanidmPersonAccountStatus {\n                    conditions: Some(conditions),\n                    ready: false,\n                    gid: None,\n                    kanidm_ref: self.kanidm_ref(),\n                })\n'''
          new = '''                Ok(KanidmPersonAccountStatus {\n                    conditions: Some(conditions),\n                    credential_state: CredentialState::Unknown,\n                    credentials_token_expiry: None,\n                    ready: false,\n                    gid: None,\n                    kanidm_ref: self.kanidm_ref(),\n                })\n'''
          s = replace_once(s, old, new, "missing status fields")

          # Replace obsolete CUStatus unit tests with action-gating tests.
          test_idx = s.index('\n#[cfg(test)]\nmod tests {')
          s = s[:test_idx] + '''\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn bootstrap_token_is_only_created_for_absent_credentials() {\n        let now = 1_000;\n        assert!(should_create_credentials_token(\n            CredentialState::Absent,\n            None,\n            now\n        ));\n        assert!(should_create_credentials_token(\n            CredentialState::Absent,\n            Some(now),\n            now\n        ));\n        assert!(!should_create_credentials_token(\n            CredentialState::Absent,\n            Some(now + 1),\n            now\n        ));\n        assert!(!should_create_credentials_token(\n            CredentialState::Present,\n            None,\n            now\n        ));\n        assert!(!should_create_credentials_token(\n            CredentialState::Unknown,\n            None,\n            now\n        ));\n    }\n}\n'''
          p.write_text(s)

          # --- WebAuthn test dependencies.
          p = Path("Cargo.toml")
          s = p.read_text()
          anchor = 'kanidm_proto = "1.11.2"\n'
          deps = 'webauthn-authenticator-rs = { version = "0.6.1-dev", default-features = false }\nwebauthn-rs = { version = "0.6.1-dev", features = ["preview-features"] }\n'
          s = replace_once(s, anchor, anchor + deps, "workspace webauthn deps")
          p.write_text(s)

          p = Path("tests/Cargo.toml")
          s = p.read_text()
          anchor = 'kanidm_proto = { workspace = true }\n'
          deps = 'webauthn-authenticator-rs = { workspace = true, features = ["softpasskey", "softtoken"] }\nwebauthn-rs = { workspace = true }\n'
          s = replace_once(s, anchor, anchor + deps, "test webauthn deps")
          p.write_text(s)

          # --- E2E helpers and complete credential matrix.
          p = Path("tests/e2e/test/person.rs")
          s = p.read_text()
          s = s.replace(
              'use kaniop_person::crd::KanidmPersonAccount;',
              'use kaniop_person::crd::{CredentialState, KanidmPersonAccount};',
          )
          s = replace_once(
              s,
              'use kanidm_proto::internal::CURegState;\n',
              'use kanidm_proto::internal::CURegState;\nuse webauthn_authenticator_rs::softpasskey::SoftPasskey;\nuse webauthn_authenticator_rs::softtoken::{self, SoftToken};\nuse webauthn_authenticator_rs::WebauthnAuthenticator;\nuse webauthn_rs::prelude::AttestationCaListBuilder;\n',
              "webauthn imports",
          )
          s = replace_once(
              s,
              'use kube::api::DeleteParams;\n',
              'use kube::api::DeleteParams;\nuse k8s_openapi::api::apps::v1::Deployment;\n',
              "deployment import",
          )

          helper_anchor = 'fn is_person_ready() -> impl Condition<KanidmPersonAccount> {'
          helper_pos = s.index(helper_anchor)
          helper_end = s.index('\n}\n\n', helper_pos) + 3
          helpers = r'''

fn has_credential_state(state: CredentialState) -> impl Condition<KanidmPersonAccount> {
    move |obj: Option<&KanidmPersonAccount>| {
        obj.and_then(|person| person.status.as_ref())
            .is_some_and(|status| status.credential_state == state)
    }
}

async fn force_person_reconcile(api: &Api<KanidmPersonAccount>, name: &str) {
    api.patch(
        name,
        &PatchParams::default(),
        &Patch::Merge(&json!({
            "metadata": {"annotations": {"kaniop/e2e-force-update": Timestamp::now().to_string()}}
        })),
    )
    .await
    .unwrap();
}

async fn token_event_count(client: Client, namespace: &str, uid: &str) -> usize {
    let event_api = Api::<Event>::namespaced(client, namespace);
    let opts = ListParams::default().fields(&format!(
        "involvedObject.kind=KanidmPersonAccount,involvedObject.apiVersion=kaniop.rs/v1beta1,involvedObject.uid={uid}"
    ));
    event_api
        .list(&opts)
        .await
        .unwrap()
        .items
        .iter()
        .filter(|event| event.reason.as_deref() == Some("TokenCreated"))
        .count()
}

async fn create_person_for_credential_test(
    api: &Api<KanidmPersonAccount>,
    name: &str,
    displayname: &str,
) -> String {
    api.delete(name, &DeleteParams::default()).await.ok();
    let person_spec = json!({
        "kanidmRef": {"name": KANIDM_NAME},
        "personAttributes": {"displayname": displayname},
    });
    let person = KanidmPersonAccount::new(name, serde_json::from_value(person_spec).unwrap());
    let uid = api
        .create(&PostParams::default(), &person)
        .await
        .unwrap()
        .uid()
        .unwrap();
    wait_for(api.clone(), name, is_person("Exists")).await;
    wait_for(api.clone(), name, has_credential_state(CredentialState::Absent)).await;
    poll_until("initial TokenCreated event", || {
        let client = api.clone().into_client();
        let uid = uid.clone();
        async move { (token_event_count(client, "default", &uid).await == 1).then_some(()) }
    })
    .await;
    uid
}

async fn setup_passkey(client: &kanidm_client::KanidmClient, name: &str) {
    let intent = client
        .idm_person_account_credential_update_intent(name, Some(1234))
        .await
        .unwrap();
    let session_client = client.new_session().unwrap();
    let (session_token, _) = session_client
        .idm_account_credential_update_exchange(intent.token)
        .await
        .unwrap();
    let status = session_client
        .idm_account_credential_update_passkey_init(&session_token)
        .await
        .unwrap();
    let challenge = match status.mfaregstate {
        CURegState::Passkey(challenge) => challenge,
        other => panic!("unexpected passkey registration state: {other:?}"),
    };
    let mut authenticator = SoftPasskey::new(true);
    let response = authenticator
        .do_registration(session_client.get_origin().clone(), challenge)
        .unwrap();
    session_client
        .idm_account_credential_update_passkey_finish(
            &session_token,
            "e2e-passkey".to_string(),
            response,
        )
        .await
        .unwrap();
    session_client
        .idm_account_credential_update_commit(&session_token)
        .await
        .unwrap();
}

async fn setup_attested_passkey(client: &kanidm_client::KanidmClient, name: &str) -> String {
    let group = format!("{name}-attested-policy");
    client.idm_group_create(&group, None).await.unwrap();
    client.group_account_policy_enable(&group).await.unwrap();
    client.idm_group_add_members(&group, &[name]).await.unwrap();

    let (mut authenticator, ca_root) = SoftToken::new(true).unwrap();
    let mut builder = AttestationCaListBuilder::new();
    builder
        .insert_device_x509(
            ca_root,
            softtoken::AAGUID,
            "e2e-softtoken".to_string(),
            Default::default(),
        )
        .unwrap();
    let attestation = serde_json::to_string(&builder.build()).unwrap();
    client
        .group_account_policy_webauthn_attestation_set(&group, &attestation)
        .await
        .unwrap();

    let intent = client
        .idm_person_account_credential_update_intent(name, Some(1234))
        .await
        .unwrap();
    let session_client = client.new_session().unwrap();
    let (session_token, _) = session_client
        .idm_account_credential_update_exchange(intent.token)
        .await
        .unwrap();
    let status = session_client
        .idm_account_credential_update_attested_passkey_init(&session_token)
        .await
        .unwrap();
    let challenge = match status.mfaregstate {
        CURegState::AttestedPasskey(challenge) => challenge,
        other => panic!("unexpected attested passkey registration state: {other:?}"),
    };
    let response = authenticator
        .do_registration(session_client.get_origin().clone(), challenge)
        .unwrap();
    session_client
        .idm_account_credential_update_attested_passkey_finish(
            &session_token,
            "e2e-attested-passkey".to_string(),
            response,
        )
        .await
        .unwrap();
    session_client
        .idm_account_credential_update_commit(&session_token)
        .await
        .unwrap();
    group
}

async fn restart_operator(client: Client) {
    let deployments = Api::<Deployment>::namespaced(client, "kaniop");
    let deployment = deployments.get("kaniop").await.unwrap();
    let previous_generation = deployment.metadata.generation.unwrap_or_default();
    deployments
        .patch(
            "kaniop",
            &PatchParams::default(),
            &Patch::Merge(&json!({
                "spec": {"template": {"metadata": {"annotations": {
                    "kaniop/e2e-restarted-at": Timestamp::now().to_string()
                }}}}
            })),
        )
        .await
        .unwrap();
    poll_until("operator deployment rollout", || {
        let deployments = deployments.clone();
        async move {
            let deployment = deployments.get("kaniop").await.ok()?;
            let status = deployment.status?;
            let generation = deployment.metadata.generation.unwrap_or_default();
            (generation > previous_generation
                && status.observed_generation.unwrap_or_default() >= generation
                && status.updated_replicas == status.replicas
                && status.available_replicas == status.replicas)
                .then_some(())
        }
    })
    .await;
}
'''
          s = s[:helper_end] + helpers + s[helper_end:]

          test_start = s.index('e2e_test!(person_credential_false_for_new_user, {')
          test_end = s.index('e2e_test!(person_resource_version_stable_minimal, {', test_start)
          tests = r'''e2e_test!(person_credential_bootstrap_persists_token_expiry, {
    let name = "test-cred-bootstrap-state";
    let s = setup_kanidm_connection(KANIDM_NAME).await;
    let person_api = Api::<KanidmPersonAccount>::namespaced(s.client.clone(), "default");
    let uid = create_person_for_credential_test(&person_api, name, "Credential Bootstrap").await;

    let person = person_api.get(name).await.unwrap();
    let status = person.status.unwrap();
    assert_eq!(status.credential_state, CredentialState::Absent);
    assert!(status.credentials_token_expiry.is_some());

    for _ in 0..2 {
        force_person_reconcile(&person_api, name).await;
        tokio::time::sleep(stabilization_delay()).await;
    }
    assert_eq!(token_event_count(s.client.clone(), "default", &uid).await, 1);

    person_api.delete(name, &DeleteParams::default()).await.unwrap();
});

e2e_test!(person_credential_present_with_password, {
    let name = "test-cred-password";
    let s = setup_kanidm_connection(KANIDM_NAME).await;
    let person_api = Api::<KanidmPersonAccount>::namespaced(s.client.clone(), "default");
    let uid = create_person_for_credential_test(&person_api, name, "Password Credential").await;

    s.kanidm_client
        .idm_person_account_primary_credential_set_password(name, "e2e-test-password-123")
        .await
        .unwrap();
    force_person_reconcile(&person_api, name).await;
    wait_for(person_api.clone(), name, has_credential_state(CredentialState::Present)).await;
    wait_for(person_api.clone(), name, is_person("Credential")).await;
    assert_eq!(token_event_count(s.client.clone(), "default", &uid).await, 1);
    assert!(person_api.get(name).await.unwrap().status.unwrap().credentials_token_expiry.is_none());

    person_api.delete(name, &DeleteParams::default()).await.unwrap();
