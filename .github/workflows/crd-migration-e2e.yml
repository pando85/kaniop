        run: |
          gzip -dc /tmp/kaniop-artifacts/kaniop-images-*.tar.gz | docker load
          docker image ls

      - name: Fallback - build images locally
        if: steps.dl.outcome != 'success'
        env:
          SKIP_IMAGE_BUILD: "false"
        run: make images

      - name: Download CRDs artifact
        uses: actions/download-artifact@v8
        with:
          name: kaniop-crds
          path: charts/kaniop/crds

      - name: Run failure-injection tests
        env:
          CLEANUP_ON_EXIT: "true"
        run: CARGO_TARGET=x86_64-unknown-linux-gnu tests/e2e/scripts/crd-migration-failures.sh
