                      If omitted, Kanidm will generate it automatically.

                      More info:
                      https://kanidm.github.io/kanidm/stable/accounts/posix_accounts_and_groups.html#uid-and-gid-numbers
                    type: integer
                    minimum: 0.0
                    nullable: true
                  loginshell:
                    description: |-
