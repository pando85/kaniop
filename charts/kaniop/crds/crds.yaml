                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                nullable: true
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialBootstrap:
                default:
                  state: pending
                description: |-
                  Persistent bootstrap state. Keeping the token expiry in status prevents operator restarts from
                  generating duplicate reset tokens while preserving the existing retry-after-expiry behaviour.
                properties:
                  deliveryError:
                    description: A known blocking reason; cleared after a successful bootstrap request.
                    nullable: true
                    type: string
                  deliveryMethod:
                    description: The successful delivery method for the current bootstrap attempt.
                    enum:
                    - event
                    - email
                    - null
                    nullable: true
                    type: string
                  emailQueuedAt:
                    description: When Kanidm accepted an email into its outgoing queue (not SMTP delivery).
                    format: date-time
                    nullable: true
                    type: string
                  lastQueuedResendRevision:
                    description: |-
                      Highest resend revision whose email was accepted into Kanidm's queue.
                      Kept across changes to the configured delivery method.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  state:
                    default: pending
                    description: Lifecycle of the initial credential bootstrap for a person account.
                    enum:
                    - pending
                    - tokenIssued
                    - complete
                    type: string
                  tokenExpiresAt:
                    description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                    format: date-time
                    nullable: true
                    type: string
                type: object
              credentialState:
                default: unknown
                description: |-
                  Observed credential presence. `Unknown` is fail-closed: it must never trigger credential
                  bootstrap or reset-token creation.
                enum:
                - unknown
                - present
                - absent
                type: string
              gid:
                type: integer
                minimum: 0.0
                nullable: true
              kanidmRef:
                type: string
              managedSshPublicKeyTags:
                default: []
                description: |-
                  Tags claimed by this resource after successful synchronization with Kanidm.
