                      If omitted, the account will be valid from the time of creation.
                    format: date-time
                    nullable: true
                    type: string
                  displayname:
                    description: Set the display name for the service account.
                    type: string
                  entryManagedBy:
                    description: Name/spn of a group or account that have entry manager rights over this service account.
                    type: string
                  mail:
                    description: |-
