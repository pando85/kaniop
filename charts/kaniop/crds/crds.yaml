                      nullable: true
                      type: string
                  required:
                  - label
                  type: object
                nullable: true
                type: array
              credentialsRotation:
                description: |-
                  Automatic rotation configuration for the credentials secret. Only applies when
                  generate_credentials is true. When enabled, the operator will regenerate the password
