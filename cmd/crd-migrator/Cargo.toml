[package]
name = "kaniop-crd-migrator"
description = "Helm hook that server-side applies the Kaniop CRDs"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "kaniop-crd-migrator"
path = "src/main.rs"

[dependencies]
kaniop-backup = { workspace = true, features = ["schemars"] }
kaniop-group = { workspace = true, features = ["schemars"] }
kaniop-oauth2 = { workspace = true, features = ["schemars"] }
kaniop-operator = { workspace = true, features = ["schemars"] }
kaniop-person = { workspace = true, features = ["schemars"] }
kaniop-service-account = { workspace = true, features = ["schemars"] }
kaniop-radius = { workspace = true, features = ["schemars"] }
clap = { workspace = true, features = ["cargo", "env"] }
k8s-openapi = { workspace = true }
kube = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
