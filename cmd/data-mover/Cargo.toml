[package]
name = "kaniop-data-mover"
description = "S3-compatible data mover for Kanidm backup payload and manifest transfer"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "kaniop-data-mover"
path = "src/main.rs"

[dependencies]
kaniop-backup-core = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
hex = { workspace = true }
http = { workspace = true }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-native-tls", "fail-on-err"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = { workspace = true }
